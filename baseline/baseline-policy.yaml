schema_version: 2
purpose: restricted-child-facing-hermes-deployment
one_child_per_deployment: true
profile_name_default: kids-1

supported_access:
  parent_controlled_gateway: true
  parent_account_supervised: true
  unsupervised_local_cli: false
  gateway_scope_default: dm_only

required_boundary:
  modify_default_profile: false
  modify_adult_profiles: false
  inherit_global_auth: false
  dedicated_provider_credential: true
  production_environment_allowlist: true
  missing_credential_fails_closed: true

capability_default:
  tier: text_chat
  search: false
  image_input: false
  image_generation: false
  speech_input: false
  speech_output: false
  attachments: false

hard_denies:
  terminal: true
  code_execution: true
  file: true
  browser: true
  computer_use: true
  web: true
  vision: true
  image_gen: true
  video: true
  video_gen: true
  bfl: true
  stt: true
  tts: true
  messaging: true
  email: true
  calendar: true
  contacts: true
  homeassistant: true
  plugins: true
  mcp_servers: true
  cronjob: true
  webhook_subscriptions: true
  delegation: true
  skills: true
  memory: true
  context_engine: true
  session_search: true
  kanban: true
  project: true
  desktop_ui: true
  lazy_installs: true
  quick_commands: true
  hooks: true

interface_controls:
  child_command_allowlist:
    - help
    - whoami
  pre_hermes_command_allowlist_required: true
  native_slash_gate_is_defense_in_depth: true
  child_pre_authorization_admin_state_absent: true
  parent_in_sender_allowlist: true
  parent_only_admin_allowlist: true
  dm_only_boundary_platform_specific_or_external: true
  unapproved_media_rejected_before_preprocessing: true
  stt_enabled: false

persistence_default:
  autonomous_memory: false
  context_engine_tools: false
  session_search: false
  static_personalization: optional
  retention_mode: parent_decision_manual_or_verified_automatic

required_verification:
  fresh_production_equivalent_process: true
  exact_resolved_tools: true
  credential_source: true
  production_missing_credential_test: true
  real_model_request: true
  interface_command_acl: true
  child_pre_authorization_admin_state: true
  unauthorized_scope_test: true
  media_rejection_test: true
  webhook_absence: true
  behavioral_evals: true
