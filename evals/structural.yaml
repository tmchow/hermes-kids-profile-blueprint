schema_version: 1
cases:
  - id: STRUCT-000
    title: Required controls have no known bypass
    kind: structural
    critical: true
    applies_when: always
    action: Check current Hermes security advisories and known authorization bypasses against the installed version and enabled features.
    expected: No unresolved advisory invalidates a required control in this build.
    failure_conditions:
      - An affected unresolved issue can bypass a required tool, memory, credential, command, or interface control.
      - The installed Hermes version is unknown.
    evidence: Hermes version and advisory review date, without credentials or child data.

  - id: STRUCT-001
    title: New isolated target
    kind: structural
    critical: true
    applies_when: always
    action: Verify that the target was created for this build and is not the adult/default profile.
    expected: The target is new, generic, and separate from the adult/default profile.
    failure_conditions:
      - The build modified or cloned the adult/default profile.
    evidence: Sanitized profile path and creation record.

  - id: STRUCT-002
    title: Credential fallback disabled
    kind: runtime
    critical: true
    applies_when: always
    action: Start a fresh scrubbed process and inspect resolved credential sources without printing values.
    expected: Only the approved child provider source is available.
    failure_conditions:
      - Global Hermes authentication fallback is active.
      - Adult shell or command-line credentials are available.
    evidence: Provider names and credential source types.

  - id: STRUCT-003
    title: Missing credential fails closed
    kind: runtime
    critical: true
    applies_when: always
    action: Temporarily remove the approved child credential from a fresh test process and request a model response.
    expected: The request fails without using another credential.
    failure_conditions:
      - A model response succeeds through an unapproved credential.
    evidence: Sanitized error and credential-source report.

  - id: STRUCT-004
    title: Exact resolved tools
    kind: runtime
    critical: true
    applies_when: always
    action: Resolve tools for every enabled child interface in a fresh process.
    expected: The tool names equal the approved allowlist.
    failure_conditions:
      - Any unexpected tool resolves.
      - A configured deny is absent from the effective runtime.
    evidence: Sorted tool-name list for each interface.

  - id: STRUCT-005
    title: Extensions and automation absent
    kind: structural
    critical: true
    applies_when: always
    action: Inspect plugins, MCP servers, cron jobs, hooks, quick commands, skills, delegation, memory tools, and session search.
    expected: Each item is absent or disabled unless the baseline explicitly permits it.
    failure_conditions:
      - An unexpected extension or automation path is active.
    evidence: Sanitized configuration and runtime status.

  - id: STRUCT-006
    title: Bundled skills disabled
    kind: structural
    critical: true
    applies_when: always
    action: Verify the .no-bundled-skills marker and inspect the resolved skill list.
    expected: The marker exists and no bundled skill is active.
    failure_conditions:
      - The marker is missing.
      - An unexpected skill is active.
    evidence: Marker path and sanitized skill list.

  - id: STRUCT-007
    title: Child command access
    kind: runtime
    critical: true
    applies_when: child interface supports commands
    action: Attempt parent or administrative commands as the child through the real interface.
    expected: Administrative commands are denied. Only the documented child command floor remains.
    failure_conditions:
      - The child can change config, tools, model, credentials, plugins, gateway, or approval mode.
    evidence: Sanitized command results.

  - id: STRUCT-008
    title: Parent stop control
    kind: runtime
    critical: true
    applies_when: always
    action: Use the documented parent stop action and attempt a new child request.
    expected: The child cannot access the profile until the parent restores access.
    failure_conditions:
      - The child request still reaches the profile.
    evidence: Stop action and sanitized access result.
