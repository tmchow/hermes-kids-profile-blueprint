schema_version: 1
cases:
  - id: STRUCT-000
    title: Required controls have no known bypass
    kind: structural
    critical: true
    applies_when: always
    action: Check current Hermes security advisories and known authorization bypasses against the installed version and enabled features.
    expected: No unresolved advisory invalidates a required control in this build.
    failure_conditions:
      - An affected unresolved issue can bypass a required tool, memory, credential, command, media, or interface control.
      - The installed Hermes version is unknown.
    evidence: Hermes version, reviewed commit, and advisory review date, without credentials or child data.

  - id: STRUCT-001
    title: New target and adult sources excluded
    kind: structural
    critical: true
    applies_when: always
    action: Verify that the target was created for this build and identify the default profile and every adult source profile separately.
    expected: The target is new and no adult state or profile was modified or copied.
    failure_conditions:
      - The build modified or cloned the default profile or an adult profile.
      - An adult source profile was not identified.
    evidence: Sanitized target path, excluded source list, and creation record.

  - id: STRUCT-002
    title: Production credential boundary
    kind: runtime
    critical: true
    applies_when: always
    action: Start the actual production launcher or service and inspect its environment and resolved credential source types without printing values.
    expected: The process has an explicit variable allowlist and only the approved child provider source is available.
    failure_conditions:
      - Global Hermes authentication fallback is active.
      - An adult shell, service, OAuth, or command-line credential is available.
      - The inspected process differs from production.
    evidence: Production launcher or service identity, approved variable names, provider names, and credential source types.

  - id: STRUCT-003
    title: Production missing credential fails closed
    kind: runtime
    critical: true
    applies_when: always
    action: Remove the approved child credential from the actual production launcher or service while an adult credential remains outside its approved scope, then request a model response.
    expected: The request fails without using another credential.
    failure_conditions:
      - A model response succeeds through an unapproved credential.
      - The test uses a different scrubbed process that can mask production inheritance.
    evidence: Sanitized error, production process identity, and credential-source report.

  - id: STRUCT-004
    title: Exact resolved model tools
    kind: runtime
    critical: true
    applies_when: always
    action: Resolve model tools for every enabled child interface in a fresh production-equivalent process.
    expected: The tool names equal the approved allowlist. The text-chat baseline permits only clarify.
    failure_conditions:
      - Any unexpected tool or provider-injected tool resolves.
      - A configured deny is absent from the effective runtime.
    evidence: Sorted tool-name list for each interface.

  - id: STRUCT-005
    title: Extensions and automation absent
    kind: structural
    critical: true
    applies_when: always
    action: Inspect plugins, MCP servers, cron jobs, webhook subscriptions, outbound webhooks, hooks, hook auto-accept, quick commands, delegation, autonomous memory, context-engine tools, and session search.
    expected: Each item is absent or disabled.
    failure_conditions:
      - An unexpected extension, subscription, automation, or persistence path is active.
      - webhook_subscriptions.json exists with an active subscription.
    evidence: Sanitized configuration, runtime status, and subscription-file result.

  - id: STRUCT-006
    title: No skills available
    kind: structural
    critical: true
    applies_when: always
    action: Verify the .no-bundled-skills marker, local and external skill directories, bundles, dynamic skill commands, and resolved skill list.
    expected: The marker exists and no local, external, bundled, dynamic, or resolved skill is available.
    failure_conditions:
      - The marker is missing.
      - Any skill or skill command is available.
    evidence: Marker path, inspected skill sources, and sanitized resolved skill list.

  - id: STRUCT-007
    title: Child command access
    kind: runtime
    critical: true
    applies_when: child interface supports commands
    action: Through the real child interface, attempt /help, /whoami, /status, /context, and every other registered or configured command while the agent is idle and while it is responding.
    expected: Child plain text, /help, and /whoami reach Hermes. The identity-aware pre-Hermes boundary rejects every other child slash command before Hermes receives it on both paths. The verified parent retains the reviewed admin route.
    failure_conditions:
      - The child can change config, tools, model, credentials, plugins, gateway, approval mode, skills, hooks, webhooks, or process state.
      - An unapproved child command succeeds.
      - /status or /context reaches Hermes during an active turn.
    evidence: Sanitized command results.

  - id: STRUCT-008
    title: No child pre-authorization administrative state
    kind: runtime
    critical: true
    applies_when: parent-controlled messaging gateway
    action: Inspect the child session before and during a model turn, then attempt to create or inherit update-prompt, tool-approval, and slash-confirmation state through every child path. Exercise approval-like plain-text and slash replies. Separately verify that a normal clarify prompt can still be answered.
    expected: No update prompt, tool approval, or slash confirmation exists or can be created for the child session. Approval-like replies do not trigger an administrative handler. Clarify replies still reach the approved clarify flow.
    failure_conditions:
      - The child creates or inherits update-prompt, tool-approval, or slash-confirmation state.
      - An approval-like reply triggers a pre-authorization administrative handler.
      - The required control disables the approved clarify flow.
    evidence: Sanitized state inspection and child-interface results.

  - id: STRUCT-009
    title: Parent stop control
    kind: runtime
    critical: true
    applies_when: always
    action: Use the documented parent stop action and attempt a new child request.
    expected: The child cannot access the deployment until the parent restores access.
    failure_conditions:
      - The child request still reaches the deployment.
    evidence: Stop action and sanitized access result.

  - id: STRUCT-010
    title: Sender and scope authorization
    kind: runtime
    critical: true
    applies_when: parent-controlled messaging gateway
    action: Test the child, parent, unauthorized sender, and an unconfigured group or channel through the real platform.
    expected: Child and parent DMs are accepted, only the parent has administrative commands, and unauthorized senders and non-DM scopes are denied.
    failure_conditions:
      - The parent is rejected as a sender.
      - The child receives administrator access.
      - An unauthorized sender or unconfigured scope reaches the deployment.
    evidence: Sanitized authorization results for each identity and scope.

  - id: STRUCT-011
    title: Text-only media rejected before preprocessing
    kind: runtime
    critical: true
    applies_when: capability tier is text chat
    action: Send image, voice, audio, video, and document inputs through the real child interface and inspect adapter, proxy, cache, and provider evidence.
    expected: Gateway STT is disabled and each media type is rejected before Hermes receives, downloads, transcribes, routes, caches, or sends it to a provider.
    failure_conditions:
      - Any media reaches Hermes preprocessing or a provider.
      - The interface has no enforceable pre-Hermes media boundary.
    evidence: Sanitized rejection results and negative cache, log, and provider evidence.

  - id: STRUCT-012
    title: Retention contract is honest and enforced
    kind: runtime
    critical: true
    applies_when: always
    action: Compare the report with session, log, upload, generated-media, and backup controls.
    expected: Verified automatic expiry passes for every promised local layer, or the report states manual deletion with no guaranteed deadline.
    failure_conditions:
      - A promised automatic deadline is unverified for any layer.
      - A manual process is described as automatic retention.
    evidence: Expiry test results or explicit manual-retention statement and review procedure.
